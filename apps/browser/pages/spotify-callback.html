<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify - Connecting...</title>
    <style>
        body {
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #1db954;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { color: #1db954; margin: 0 0 8px; font-size: 16px; }
        p { color: #aaa; font-size: 12px; margin: 0; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Connecting to Spotify...</h2>
        <p id="message">Please wait while we complete the connection.</p>
    </div>

    <script>
        // Extract auth code or error from URL params
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');

        if (error) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('title').textContent = 'Connection Failed';
            document.getElementById('title').classList.add('error');
            document.getElementById('message').textContent = error === 'access_denied'
                ? 'You denied the authorization request.'
                : 'An error occurred: ' + error;

            // Notify parent window
            if (window.opener) {
                window.opener.postMessage({ type: 'spotify-auth-callback', error: error }, '*');
            }
            setTimeout(() => window.close(), 2000);
        } else if (code) {
            document.getElementById('title').textContent = 'Connected!';
            document.getElementById('message').textContent = 'Closing this window...';

            // Send code back to parent window (WigCord)
            if (window.opener) {
                window.opener.postMessage({ type: 'spotify-auth-callback', code: code }, '*');
            }
            setTimeout(() => window.close(), 1000);
        } else {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('title').textContent = 'Invalid Request';
            document.getElementById('title').classList.add('error');
            document.getElementById('message').textContent = 'No authorization code received.';
            setTimeout(() => window.close(), 3000);
        }
    </script>
</body>
</html>
